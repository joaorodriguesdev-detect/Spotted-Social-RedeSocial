<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Notificações | Spotted</title>
    <style>
        body.dark-mode { background-color: #000000; color: #e7e9ea; }
        body.dark-mode .bg-white { background-color: #16181c !important; border-color: #2f3336; }
        body.dark-mode nav { background-color: rgba(0, 0, 0, 0.8) !important; border-color: #2f3336; }
        body.dark-mode .text-gray-800 { color: #e7e9ea !important; }
        body.dark-mode .border { border-color: #2f3336; }
        body.dark-mode .hover\:bg-gray-50:hover { background-color: rgba(255, 255, 255, 0.05) !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>

    <nav class="bg-white border-b py-4 px-6 sticky top-0 z-50 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-indigo-600">Atividade</h1>
            <a href="/feed" class="text-gray-500 hover:text-indigo-600"><i class="fa-solid fa-house text-xl"></i></a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto pt-8 px-4 pb-20">
        <div class="space-y-4">
            {% for n in notifications %}
            <div class="bg-white p-4 rounded-2xl border flex items-center justify-between shadow-sm hover:bg-gray-50 transition">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xl uppercase">
                        {{ n.sender_name[0] }}
                    </div>
                    <div>
                        <p class="text-sm">
                            <span class="font-bold">@{{ n.sender_name }}</span> {{ n.action_type }}
                        </p>
                        <p class="text-[10px] text-gray-400 font-bold mt-1">
                            {{ n.timestamp.strftime('%H:%M • %d/%m/%Y') }}
                        </p>
                    </div>
                </div>
                {% if n.post_id %}
                <a href="/feed#post-{{ n.post_id }}" class="text-indigo-600 hover:text-indigo-800"><i class="fa-solid fa-chevron-right"></i></a>
                {% endif %}
            </div>
            {% else %}
            <div class="text-center py-20">
                <i class="fa-regular fa-bell-slash text-5xl text-gray-200 mb-4"></i>
                <p class="text-gray-400 font-medium">Nenhuma notificação por enquanto.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
