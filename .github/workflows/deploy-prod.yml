name: Deploy para Produção (Main)

on:
  push:
    branches:
      - main # O robô só acorda quando tem código novo na branch principal

jobs:
  testar_codigo:
    name: 🧪 Rodar Testes
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do sistema (bibliotecas para Pillow)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libjpeg-dev zlib1g-dev libwebp-dev libtiff5-dev libopenjp2-7-dev libfreetype6-dev pkg-config \
            && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt

  atualizar_servidor:
    name: 🚀 Deploy na VPS (Produção)
    runs-on: ubuntu-latest
    needs: testar_codigo # Só executa se os testes passarem

    # ISSO AQUI ABRE A GAVETA DE SECRETS DA PRODUÇÃO!
    environment: production

    steps:
      - name: Conectar via SSH e atualizar PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            
            # --- LENDO VARIÁVEIS DOS SECRETS ---
            APP_DIR="${{ secrets.APP_DIR }}"
            PM2_PROCESS="${{ secrets.PM2_NAME }}"
            PORT="${{ secrets.PORT }}"
            PM2_BIN="/root/.bun/bin/pm2"
            # -----------------------------------
            
            echo "Preparando deploy de PRODUÇÃO para $APP_DIR na porta $PORT (processo $PM2_PROCESS)"
            
            # Garante que a pasta existe (cria se for a primeira vez)
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Se a pasta estiver vazia, clona o repo. Se não, atualiza.
            if [ ! -d ".git" ]; then
              echo "Clonando repositório pela primeira vez..."
              git clone -b main https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .
            else
              echo "Baixando novidades da origin/main..."
              git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
