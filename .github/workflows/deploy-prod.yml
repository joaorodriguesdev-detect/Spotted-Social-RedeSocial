name: Deploy para Produção (Main)

on:
  push:
    branches:
      - main

jobs:
  testar_codigo:
    name: 🧪 Rodar Testes
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ADICIONADO: Instalar libs de imagem no servidor do GitHub
      - name: Instalar dependências de sistema (Runner)
        run: |
          sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libwebp-dev

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Força binário no runner também para ser mais rápido
          python -m pip install --only-binary=:all: Pillow
          python -m pip install --no-cache-dir -r requirements.txt

  atualizar_servidor:
    name: 🚀 Deploy na VPS (Produção)
    needs: testar_codigo
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Conectar via SSH e atualizar PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR || '/opt/spotted' }}"
            PM2_PROCESS="${{ secrets.PM2_NAME || 'spotted-app' }}"
            PORT="${{ secrets.PORT || '5000' }}"
            PM2_BIN="${{ secrets.PM2_BIN_PATH || '/root/.bun/bin/pm2' }}"

            echo "Garantindo dependências na VPS de Produção..."
            sudo apt-get update && sudo apt-get install -y \
              python3-venv \
              python3-pip \
              python3-dev \
              libjpeg-dev \
              zlib1g-dev \
              libwebp-dev

            cd "$APP_DIR"

            echo "Atualizando código Production..."
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git fetch --all --prune
            git reset --hard origin/main

            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            echo "Instalando dependências de Produção..."
            pip install --upgrade pip setuptools wheel
            pip install --only-binary=:all: Pillow
            pip install --no-cache-dir -r requirements.txt

            echo "Reiniciando PM2 Produção..."
            $PM2_BIN restart "$PM2_PROCESS" --update-env || \
            $PM2_BIN start ./venv/bin/gunicorn --interpreter ./venv/bin/python --name "$PM2_PROCESS" -- --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 127.0.0.1:$PORT app:app

            $PM2_BIN save || true
            echo "Deploy de Produção Finalizado!"