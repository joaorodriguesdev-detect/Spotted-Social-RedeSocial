name: Deploy para Produção (Main)

on:
  push:
    branches:
      - main # O robô só acorda quando tem código novo na branch principal

jobs:
  testar_codigo:
    name: 🧪 Rodar Testes
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do sistema (bibliotecas para Pillow)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libjpeg-dev zlib1g-dev libwebp-dev libtiff5-dev libopenjp2-7-dev libfreetype6-dev pkg-config \
            && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt

  atualizar_servidor:
    name: 🚀 Deploy na VPS (Produção)
    needs: testar_codigo
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Conectar via SSH e atualizar PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR || '/opt/spotted' }}"
            PM2_PROCESS="${{ secrets.PM2_NAME || 'spotted-app' }}"
            PORT="${{ secrets.PORT || '5000' }}"
            PM2_BIN="${{ secrets.PM2_BIN_PATH || '/root/.bun/bin/pm2' }}"

            echo "Instalando dependências de sistema para Pillow na VPS de Produção..."
            sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libwebp-dev

            echo "Preparando deploy de PRODUÇÃO para $APP_DIR na porta $PORT (processo $PM2_PROCESS)"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              if [ -z "$(ls -A .)" ]; then
                echo "Diretório vazio — clonando repositório..."
                git clone -b main https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .
              else
                echo "Diretório existente sem .git — inicializando..."
                git init
                git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" || true
                git fetch --all --prune
                git reset --hard origin/main
              fi
            else
              echo "Repositório Git detectado — buscando novidades..."
              git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
              git fetch --all --prune
              git remote set-url origin "https://github.com/${{ github.repository }}.git"
            fi

            # Verificação de segurança em diretório temporário
            TMP_DIR=$(mktemp -d 2>/dev/null || mktemp -d -t deploy-test)
            git archive origin/main | tar -x -C "$TMP_DIR"
            
            if python3 -m venv "$TMP_DIR/venv"; then
              source "$TMP_DIR/venv/bin/activate"
              python -m pip install --upgrade pip setuptools wheel
              if [ -f "$TMP_DIR/requirements.txt" ]; then
                if ! python -m pip install --no-cache-dir -r "$TMP_DIR/requirements.txt"; then
                  echo "Falha no teste de dependências — abortando para não quebrar a produção"
                  exit 1
                fi
              fi
            fi

            echo "Verificação concluída — aplicando atualização na árvore live"
            git reset --hard origin/main

            # Criar/atualizar venv live
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            echo "Atualizando ambiente live..."
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install --no-cache-dir -r requirements.txt

            echo "Reiniciando processo $PM2_PROCESS..."
            $PM2_BIN restart "$PM2_PROCESS" --update-env || \
            $PM2_BIN start ./venv/bin/gunicorn --interpreter ./venv/bin/python --name "$PM2_PROCESS" -- --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 127.0.0.1:$PORT app:app
            
            $PM2_BIN save || true
            echo "Deploy de Produção finalizado com sucesso!"