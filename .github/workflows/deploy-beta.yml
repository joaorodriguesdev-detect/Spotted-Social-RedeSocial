name: Atualizar Branch Beta Segura

on:
  push:
    branches:
      - beta # O robô só acorda quando tem código novo nesta branch

jobs:
  testar_codigo:
    name: 🧪 Rodar Testes
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

  atualizar_servidor:
    name: 🚀 Deploy na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e atualizar PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            # Diretório da aplicação configurável via secret (default /opt/spotted)
            APP_DIR="${{ secrets.APP_DIR || '/opt/spotted' }}"
            PM2_PROCESS="${{ secrets.PM2_PROCESS_NAME || 'spotted-app' }}"
            echo "Preparing deploy check for $APP_DIR (process $PM2_PROCESS)"
            cd "$APP_DIR"
            echo "Fetching latest from origin/beta"
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git fetch --all --prune
            git remote set-url origin "https://github.com/${{ github.repository }}.git"

            # Prepare temporary test workspace with the target branch contents
            TMP_DIR=$(mktemp -d 2>/dev/null || mktemp -d -t deploy-test)
            echo "Creating test tree at $TMP_DIR"
            git archive origin/beta | tar -x -C "$TMP_DIR"

            # Create and activate a temporary venv for verification. If the
            # system lacks python3-venv (ensurepip), fall back to a syntax-only
            # check using the system Python to avoid aborting the deploy due to
            # missing OS packages on the server.
            FALLBACK_PY_COMPILE=0
            if python3 -m venv "$TMP_DIR/venv" 2>/tmp/venv_create_err.log; then
              echo "Temporary venv created at $TMP_DIR/venv"
              source "$TMP_DIR/venv/bin/activate"
              # Try to enable pip inside the venv. If ensurepip isn't available
              # the upgrade will fail; in that case fall back to a syntax-only
              # check so deploy can continue.
              if ! python -m pip install --upgrade pip 2>/tmp/venv_pip_err.log; then
                echo "pip not available in venv (ensurepip missing). Falling back to syntax-only check. See /tmp/venv_pip_err.log"
                FALLBACK_PY_COMPILE=1
              else
                # Install requirements if present (best-effort). If install fails,
                # we consider verification failed to be conservative.
                if [ -f "$TMP_DIR/requirements.txt" ]; then
                  echo "Installing dependencies into test venv (this may take a while)"
                  if ! python -m pip install --no-cache-dir -r "$TMP_DIR/requirements.txt"; then
                    echo "Dependency installation failed — aborting deploy"
                    exit 1
                  fi
                else
                  echo "No requirements.txt found in branch — skipping deps install"
                fi
              fi
            else
              echo "Could not create temporary venv. Falling back to syntax-only check. See /tmp/venv_create_err.log for details."
              FALLBACK_PY_COMPILE=1
            fi

            # Syntax check: compile all Python files to catch syntax errors/import-time
            # issues that would prevent the app from starting. If we created a
            # temp venv above we'll run py_compile inside it; otherwise use the
            # system python3 for a syntax-only check.
            echo "Running python -m py_compile on branch files"
            if [ "$FALLBACK_PY_COMPILE" -eq 1 ]; then
              if ! find "$TMP_DIR" -name '*.py' -print0 | xargs -0 python3 -m py_compile; then
                echo "Syntax check failed — aborting deploy"
                exit 1
              fi
            else
              if ! find "$TMP_DIR" -name '*.py' -print0 | xargs -0 python -m py_compile; then
                echo "Syntax check failed — aborting deploy"
                exit 1
              fi
            fi

            # Optional: run a simple import check for the main module in isolation
            # without executing the app's runtime side-effects. We avoid importing
            # `app` to prevent DB/schema side-effects at import time; instead try
            # importing a lightweight module if you have one. If not available,
            # skip this step.
            # Skipping direct import-check of the app module to avoid executing
            # import-time side-effects (DB migrations, seeding, etc.). We rely on
            # dependency install and py_compile for safety verification.

            echo "Verification succeeded — applying update to $APP_DIR"
            # Apply the update to the live app directory now that verification passed
            git reset --hard origin/beta

            # Create venv if not exists in the live app and install deps. If
            # creating a venv fails on the live host (missing python3-venv),
            # fall back to installing requirements using the system python3.
            if [ ! -d venv ]; then
              echo "Creating live venv..."
              if python3 -m venv venv 2>/tmp/live_venv_err.log; then
                source venv/bin/activate
                python -m pip install --upgrade pip
                python -m pip install --no-cache-dir -r requirements.txt || true
              else
                echo "Could not create live venv; see /tmp/live_venv_err.log. Falling back to system python to install requirements."
                python3 -m pip install --upgrade pip || true
                python3 -m pip install --no-cache-dir -r requirements.txt || true
              fi
            else
              source venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install --no-cache-dir -r requirements.txt || true
            fi

            # Reinicia ou inicia o processo via pm2
            if pm2 describe "$PM2_PROCESS" > /dev/null 2>&1; then
              echo "Restarting $PM2_PROCESS"
              pm2 restart "$PM2_PROCESS"
            else
              echo "Starting $PM2_PROCESS (fallback start)"
              pm2 start app.py --name "$PM2_PROCESS" || pm2 start main.js --name "$PM2_PROCESS" || true
            fi

            echo "Deploy finished"
