name: Atualizar Branch Beta Segura

on:
  push:
    branches:
      - beta # O robô só acorda quando tem código novo nesta branch

jobs:
  testar_codigo:
    name: 🧪 Rodar Testes
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

  atualizar_servidor:
    name: 🚀 Deploy na VPS
    runs-on: ubuntu-latest
    needs: testar_codigo # Só executa se os testes passarem
    environment: beta # <--- ISSO É A MÁGICA! Puxa as variáveis exclusivas do Beta

    steps:
      - name: Conectar via SSH e atualizar PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            
            # Puxando as variáveis do Environment do GitHub
            APP_DIR="${{ secrets.APP_DIR }}"
            PM2_PROCESS="${{ secrets.PM2_PROCESS_NAME }}"
            PORT="${{ secrets.PORT }}"
            PM2_BIN="/root/.bun/bin/pm2"
            
            echo "Preparando deploy para $APP_DIR na porta $PORT (processo $PM2_PROCESS)"
            
            # Garante que a pasta existe (cria se for a primeira vez)
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Se a pasta estiver vazia, clona o repo. Se não, atualiza.
            if [ ! -d ".git" ]; then
              echo "Clonando repositório pela primeira vez..."
              git clone -b beta https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .
            else
              echo "Baixando novidades da origin/beta..."
              git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
              git fetch --all --prune
              git reset --hard origin/beta
              git remote set-url origin "https://github.com/${{ github.repository }}.git"
            fi

            # Cria/Ativa o ambiente virtual na pasta da VPS
            if [ ! -d venv ]; then
              echo "Criando ambiente virtual..."
              python3 -m venv venv
            fi
            source venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install --no-cache-dir -r requirements.txt || true

            echo "Atualizando a aplicação no PM2..."
            
            # Tenta reiniciar. Se falhar, inicia forçando as variáveis corretas.
            $PM2_BIN restart "$PM2_PROCESS" --update-env || \
            $PM2_BIN start ./venv/bin/gunicorn --interpreter ./venv/bin/python --name "$PM2_PROCESS" -- --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 127.0.0.1:$PORT app:app
            
            $PM2_BIN save
            
            echo "Deploy finalizado com sucesso na VPS!"