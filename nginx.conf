# Configuração do Nginx para Spotted Social
# Este arquivo deve ser copiado para /etc/nginx/sites-available/ ou incluído na configuração do nginx

# Aumente o limite de tamanho de corpo para permitir uploads maiores
client_max_body_size 30M;

# Blocos upstream para a aplicação Flask
upstream flask_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Redirecionar HTTP para HTTPS (opcional, para produção)
# server {
#     listen 80;
#     server_name seu_dominio.com;
#     return 301 https://$server_name$request_uri;
# }

# Bloco do servidor principal
server {
    # Protocolo e porta (use 443 com SSL em produção)
    listen 80;
    # listen 443 ssl http2;  # Para produção com SSL

    # Substitua pelo seu domínio
    server_name localhost;

    # Certificados SSL (para produção)
    # ssl_certificate /etc/letsencrypt/live/seu_dominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seu_dominio.com/privkey.pem;

    # Limite de tamanho de corpo do cliente - IMPORTANTE para uploads
    client_max_body_size 30M;

    # Configurações de segurança (para produção)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-Frame-Options "SAMEORIGIN" always;

    # Diretório raiz para arquivos estáticos públicos
    root /path/to/spotted-social;

    # Logs
    access_log /var/log/nginx/spotted-social-access.log;
    error_log /var/log/nginx/spotted-social-error.log;

    # Servir arquivos estáticos públicos
    location /static/ {
        alias /path/to/spotted-social/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Rota para arquivos públicos
    location /public/ {
        alias /path/to/spotted-social/static/public/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para a aplicação Flask
    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts para uploads de arquivo
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Para SocketIO (se usar em produção)
    location /socket.io {
        proxy_pass http://flask_app/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

